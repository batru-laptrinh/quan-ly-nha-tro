<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - HTT Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="logo"><i class="fas fa-house-chimney"></i></div>
        <h2>HTT Manager</h2>
        <p>Hệ Thống Quản Lý Nhà Trọ</p>
        <form id="loginForm">
            <div class="input-group"><i class="fas fa-user-circle"></i><input type="text" id="username" placeholder="Tên đăng nhập" required></div>
            <div class="input-group"><i class="fas fa-shield-halved"></i><input type="password" id="password" placeholder="Mật khẩu" required><i class="fas fa-eye" id="togglePassword"></i></div>
            <div class="options"><label><input type="checkbox"> Ghi nhớ</label><a onclick="moQuenMatKhau()"><i class="fas fa-question-circle"></i> Quên mật khẩu?</a></div>
            <button type="button" class="btn-login" onclick="thucHienDangNhap()"><i class="fas fa-paper-plane"></i> ĐĂNG NHẬP</button>
        </form>
    </div>
    <div class="fixed-copyright">© 2026 Bá Trừ. All rights reserved.</div>
    <div class="modal-overlay" id="modal-quen-mk">
        <div class="modal-box" style="width: 400px;">
            <h3 style="color: #2bc05a; font-size: 20px; margin-bottom: 10px;"><i class="fas fa-unlock-keyhole"></i> Phục Hồi Mật Khẩu</h3>
            <p style="font-size: 13px; color: #718096; margin-bottom: 25px;">Vui lòng nhập đúng thông tin bạn đã đăng ký với chủ trọ.</p>
            <div class="input-group"><i class="fas fa-door-open"></i><input type="text" id="rs-phong" placeholder="Tên phòng (VD: P.101)"></div>
            <div class="input-group"><i class="fas fa-phone"></i><input type="number" id="rs-sdt" placeholder="Số điện thoại liên hệ"></div>
            <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="rs-email" placeholder="Email nhận mật khẩu mới"></div>
            <div class="modal-btn-area">
                <button class="btn-nav" style="border:none" onclick="dongQuenMatKhau()">Hủy bỏ</button>
                <button class="btn-add-room" style="background:#2bc05a" onclick="xuLyPhucHoi()">Gửi Yêu Cầu</button>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
